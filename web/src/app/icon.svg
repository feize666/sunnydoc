<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="bookLeft" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2b7be0"/>
      <stop offset="1" stop-color="#185FA5"/>
    </linearGradient>
    <linearGradient id="bookRight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a94e8"/>
      <stop offset="1" stop-color="#2b7be0"/>
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa0f0"/>
      <stop offset="1" stop-color="#0f4c86"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#185FA5" flood-opacity="0.28"/>
    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="2.5" flood-color="#3b82f6" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- 白底 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- 书本主体（立体：左右两页 + 书脊 + 投影） -->
  <g filter="url(#shadow)">
    <!-- 左页 -->
    <path d="M31.5 18c-5.2-3.4-12.5-3.4-17.7 0c-1 0.6-1 2 0 2.6v26c-1 0.6-1 2 0 2.6c5.2 3.4 12.5 3.4 17.7 0z" fill="url(#bookLeft)"/>
    <!-- 右页 -->
    <path d="M32.5 18c5.2-3.4 12.5-3.4 17.7 0c1 0.6 1 2 0 2.6v26c1 0.6 1 2 0 2.6c-5.2 3.4-12.5 3.4-17.7 0z" fill="url(#bookRight)"/>
    <!-- 书脊中线 -->
    <rect x="31" y="17.5" width="2" height="32" rx="1" fill="url(#spine)"/>
  </g>

  <!-- 左页高光 -->
  <path d="M16 22.5c-1.2-0.8-1.2-2.4 0-3.2l2.5-1.6c1.6-1 3.5 0.1 3.5 2v19.8c0 1.9-2 3.1-3.6 2.1z" fill="#ffffff" opacity="0.22"/>
  <!-- 右页高光 -->
  <path d="M48 22.5c1.2-0.8 1.2-2.4 0-3.2l-2.5-1.6c-1.6-1-3.5 0.1-3.5 2v19.8c0 1.9 2 3.1 3.6 2.1z" fill="#ffffff" opacity="0.18"/>

  <!-- 页面线条（左） -->
  <path d="M18 27h9M18 31h9M18 35h9M18 39h9" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 页面线条（右） -->
  <path d="M46 27h-9M46 31h-9M46 35h-9M46 39h-9" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.6" stroke-linecap="round"/>

  <!-- 科技感发光的书脊节点 -->
  <circle cx="32" cy="20" r="1.8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="1.8" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="32" cy="44" r="1.8" fill="#ffffff" filter="url(#glow)"/>
</svg>
