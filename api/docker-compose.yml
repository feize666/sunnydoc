services:
  db:
    image: pgvector/pgvector:pg16
    container_name: sunnydoc-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: sunnydoc
      POSTGRES_PASSWORD: Sunnydoc@PG2026
      POSTGRES_DB: sunnydoc
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sunnydoc -d sunnydoc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
